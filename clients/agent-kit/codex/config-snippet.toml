# Codex config additions (~/.codex/config.toml) — HYTHE memory wiring.
# Easiest path: run `npx -y @hythe/mcp init --agent-id codex-cli` — it
# prints this exact identity-bound block ready to paste. The credential stays
# in the protected file; placeholders below are non-secret.

[mcp_servers.hythe]
command = "npx"
args = ["-y", "@hythe/mcp"]
env = { HYTHE_API_KEY_FILE = "/absolute/path/to/.env", HYTHE_AGENT_ID = "codex-cli", MCP_HOST = "127.0.0.1", MCP_PORT = "6174" }

# This binds the transport, but MCP child env is not automatically
# model-visible. Pair it with a trusted session hook/launcher that injects the
# same exact identity into Codex context. Never make a generic instruction
# file guess an identity from cwd, hostname, session metadata, or a role name.

# Memory Protocol loaded as model instructions (see instructions.md):
model_instructions_file = "~/.codex/hythe-instructions.md"

# Compaction survival — compacted summaries end with mandatory
# checkpoint/resume steps (see compact-prompt.md):
experimental_compact_prompt_file = "~/.codex/hythe-compact-prompt.md"
