# HYTHE CI — mirrors the local staged-proof gates that a runner can carry:
# typecheck, build, schema-drift, the full single-fork contract suite, and
# the docker image build and an isolated npm-tarball consumer smoke. Registry
# authentication and production backup/cutover canaries remain operator gates.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.9.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm run ci:schemas
      # Release verification remains explicit and contains no publish step.
      - run: node scripts/verify-hythe-release-tree.mjs
      - run: npm run test:release
      # Install the actual tarball in an independent consumer. Package-level
      # overrides are deliberately not trusted as downstream protection.
      - run: npm run test:packed-consumer
      - run: npm run test:agent-kit
      # Single-fork matches the proven local invocation; the contract suite
      # boots its own hermetic server (tests/global-setup.ts).
      - run: npx vitest run --pool=forks --poolOptions.forks.singleFork
      - run: npm run test:migrations
      # Validate the production topology without resolving its protected env
      # file or Pavilion host paths on the public runner.
      - run: HYTHE_RUNTIME_ENV_FILE="$GITHUB_WORKSPACE/.env.example" HYTHE_IMAGE=hythe:ci docker compose -f docker/pavilion-production.compose.yml config --quiet --no-env-resolution --no-path-resolution

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f docker/Dockerfile -t engram .
